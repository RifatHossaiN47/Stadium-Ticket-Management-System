# Alternative Production Config using Environment Variables
# This is safer than hardcoding credentials

# Database connection using environment variables
spring.datasource.url=${DATABASE_URL:jdbc:mysql://your-database-host.com:3306/stadium_management?useSSL=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:your_username}
spring.datasource.password=${DATABASE_PASSWORD:your_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Production settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Connection pool settings for production
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Server settings
server.port=${PORT:8082}

# Error handling
server.error.include-message=always
server.error.include-binding-errors=always
